[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "premiere-controller"
version = "0.2.0"
description = "Local Windows automation for Adobe Premiere Pro"
requires-python = ">=3.10"
[project.optional-dependencies]
visual = ["Pillow>=10", "pypdfium2>=4"]
[project.scripts]
pr-controller = "pr_controller.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
pr_controller = ["native/*.jsx"]
